<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 12px;
      font-family: sans-serif;
      margin: 0;
      box-sizing: border-box;
    }
    h4 {
      margin: 0 0 10px 0;
      font-size: 14px;
    }
    select, button {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button#saveBtn {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    button#permBtn {
      background-color: #17a2b8;
      color: white;
      border: none;
      cursor: pointer;
      display: none;
    }
    button#resetBtn {
      background-color: #dc3545;
      color: white;
      border: none;
      cursor: pointer;
    }
    #status {
      font-size: 11px;
      min-height: 15px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h4>Audio Router</h4>
  
  <button id="permBtn">Grant Permission for Device Names</button>

  <select id="deviceSelect">
    <option value="">Loading devices...</option>
  </select>

  <button id="saveBtn">Save for this tab</button>
  <button id="resetBtn">Reset to Default</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
