<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audio Router - Grant Permission</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
      background: #f8f9fa;
    }
    .card {
      background: white;
      max-width: 400px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 15px;
    }
    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Audio Router Permissions</h2>
    <p>Click below to grant permission so the extension can read your audio device names (Headphones, Speakers, etc.).</p>
    <button id="grantBtn">Grant Permission</button>
    <div id="status"></div>
  </div>

  <script src="permission.js"></script>
</body>
</html>
